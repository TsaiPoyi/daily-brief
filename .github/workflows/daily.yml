name: Daily Brief

on:
  schedule:                 # GitHub 內建排程（備援；可能延遲或被跳過）
    - cron: "7 22 * * *"    # UTC 22:07 = 台灣 06:07
    - cron: "7 4 * * *"     # UTC 04:07 = 台灣 12:07
    - cron: "7 10 * * *"    # UTC 10:07 = 台灣 18:07
  workflow_dispatch:        # 手動按「Run workflow」，或由外部定時服務呼叫
    inputs:
      min_gap_minutes:
        description: "距離上次更新不到幾分鐘就略過（手動執行請維持 0）"
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-brief        # 避免兩次執行同時跑

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓新聞並產生 data.json
        run: python fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 排程觸發時：2 小時內剛更新過就略過，避免與外部定時服務重複
          MIN_GAP_MINUTES: ${{ github.event.inputs.min_gap_minutes || (github.event_name == 'schedule' && '120' || '0') }}

      - name: 有變動就存回儲存庫
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update brief" && git pull --rebase && git push)
