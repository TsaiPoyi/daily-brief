name: Daily Brief

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 台灣時間早上 06:00 → 早報
    - cron: "0 4 * * *"    # UTC 04:00 = 台灣時間中午 12:00 → 午報
    - cron: "0 10 * * *"   # UTC 10:00 = 台灣時間下午 18:00 → 晚報
  workflow_dispatch:        # 允許在網頁上手動按「Run workflow」
    inputs:
      edition:
        description: "要產生哪一報（auto＝依目前時間自動判斷）"
        default: "auto"
        type: choice
        options: [auto, morning, noon, evening]

permissions:
  contents: write           # 允許機器人把 data/ 存回儲存庫

concurrency:
  group: daily-brief        # 避免兩次執行同時跑、互相打架

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下載儲存庫
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓新聞並產生 data/*.json
        run: python fetch_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITION: ${{ github.event.inputs.edition || 'auto' }}

      - name: 有變動就存回儲存庫
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update brief" && git pull --rebase && git push)
